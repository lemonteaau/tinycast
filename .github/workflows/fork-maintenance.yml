name: Fork sync, test and release
run-name: "Fork build 1.0.${{ github.run_number }}"

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fork-maintenance
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'lemonteaau/tinycast'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: 1.0.${{ github.run_number }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream locally
        id: sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash Scripts/fork-sync.sh

      - name: Check whether this commit is already released
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GH_REPO/releases" > "$RUNNER_TEMP/releases.json"
          TAG=$(jq -r '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // empty' "$RUNNER_TEMP/releases.json")
          RELEASED=''
          if [ -n "$TAG" ]; then
            RELEASED=$(git rev-parse "$TAG^{commit}" 2>/dev/null || true)
          fi
          if [ "$RELEASED" = "$(git rev-parse HEAD)" ]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'Up to date; no build or release needed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode 26 and install lint tools
        if: steps.release.outputs.needed == 'true'
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n 1)
          test -n "$XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
          brew install swiftlint actionlint ripgrep

      - name: Test and lint
        if: steps.release.outputs.needed == 'true'
        run: |
          bash Tests/fork-sync-test.sh
          ./Scripts/run-tests.sh
          ./Scripts/lint.sh
          actionlint
          if rg -l 'import (AppKit|SwiftUI|Cocoa)' Tinycast/Features/*/Model/; then
            echo 'Model layer imports UI frameworks.' >&2
            exit 1
          fi

      - name: Build Debug
        if: steps.release.outputs.needed == 'true'
        run: |
          xcodebuild -quiet -project Tinycast.xcodeproj -scheme Tinycast -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/Debug" CODE_SIGNING_ALLOWED=NO build

      - name: Import fork signing identity
        if: steps.release.outputs.needed == 'true'
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          test -n "$P12_BASE64"
          test -n "$P12_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/fork-signing.keychain-db"
          KPW=$(openssl rand -base64 24)
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/fork.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/fork.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$RUNNER_TEMP/fork.p12"

      - name: Build and package signed release
        if: steps.release.outputs.needed == 'true'
        run: |
          xcodebuild -quiet -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/Release" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Tinycast Fork lemonteaau' \
            OTHER_CODE_SIGN_FLAGS='--timestamp=none' \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
          APP="$RUNNER_TEMP/Release/Build/Products/Release/Tinycast.app"
          ./Scripts/verify-signature.sh "$APP"
          for BIN in "$APP/Contents/MacOS/Tinycast" "$APP/Contents/Helpers/ClipboardTextHelper"; do
            test "$(lipo -archs "$BIN")" = arm64
          done
          mkdir -p dist
          ditto -c -k --keepParent --sequesterRsrc "$APP" "dist/Tinycast-$VERSION.zip"
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -srcfolder "$STAGE" -volname Tinycast -format UDZO "dist/Tinycast-$VERSION.dmg"
          (cd dist && shasum -a 256 ./*.zip ./*.dmg > SHA256SUMS.txt)

      - name: Push tested merge and publish release
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.sync.outputs.base }}
          UPSTREAM: ${{ steps.sync.outputs.upstream }}
        run: |
          REMOTE=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$REMOTE" = "$BASE" || { echo 'main changed during build; rerun safely.' >&2; exit 1; }
          git push origin HEAD:main
          TAG="v$VERSION"
          {
            echo "Personal Tinycast fork build $VERSION."
            echo
            echo 'Supports currency shorthand such as 610 aud cny.'
            echo "Upstream: https://github.com/abue-ammar/tinycast/commit/$UPSTREAM"
            echo "Source: https://github.com/$GH_REPO/commit/$(git rev-parse HEAD)"
            echo
            echo 'Tests, lint, Debug build and signed arm64 Release build passed.'
            echo '<!-- tinycast:install -->'
            echo 'macOS 26+, Apple silicon. Independently signed personal fork; not Apple-notarized.'
            echo 'First install replaces Tinycast.app and retains its settings. Grant Accessibility again if prompted.'
            echo 'Subsequent in-app updates come from this fork and use the same signing identity.'
            echo 'See docs/fork.md for installation, signing and sync details.'
          } > "$RUNNER_TEMP/notes.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$(git rev-parse HEAD)" --draft \
              --title "Tinycast Fork $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest --notes-file "$RUNNER_TEMP/notes.md"
          echo "Published https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/fork.p12"
          if [ -f "$RUNNER_TEMP/fork-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/fork-signing.keychain-db"
          fi
